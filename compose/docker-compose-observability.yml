# Log pipeline for runs-server: Alloy reads every container's stdout from the Docker API and
# pushes it to Loki; the native Grafana (:3000) queries Loki. Replaces the sathishlogger
# REST appender (apps just print structured JSON to stdout).
#
# Deploy as its OWN stack in Portainer (Stacks -> Add stack, environment: runs-server, name:
# observability), separate from sathish-stack so redeploying an app never restarts the log
# pipeline. Config is inlined via `configs: content:` so this single file is the whole deploy
# (needs Docker Compose >= 2.23; if Portainer rejects it, see the bind-mount fallback in
# the bind-mount fallback at the bottom).
#
# Then add the Loki datasource to Grafana: grafana-loki-datasource.yaml (repo root).
#
# Notes:
# - Image tags are pinned and Watchtower is told to skip these containers, so the log
#   pipeline never changes underneath you. Bump the tags by hand.
# - Loki is published on 127.0.0.1 only (Grafana is native on the same host); Alloy reaches
#   it over the stack's private network. Nothing here is exposed to the LAN.
# - Alloy mounts the Docker socket read-only. Socket access is effectively root-equivalent
#   on the host even when mounted :ro; this is the accepted trade-off for label discovery.
# - Retention 30 days. Docker log rotation (10m x 5) is already enabled on the host.
services:
  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki_data:/loki
    configs:
      - source: loki_config
        target: /etc/loki/config.yaml
    labels:
      - com.centurylinklabs.watchtower.enable=false
    networks: [obs]

  alloy:
    image: grafana/alloy:v1.20.1
    container_name: alloy
    restart: unless-stopped
    user: "0:0"
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on: [loki]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    configs:
      - source: alloy_config
        target: /etc/alloy/config.alloy
    labels:
      - com.centurylinklabs.watchtower.enable=false
    networks: [obs]

networks:
  obs:

volumes:
  loki_data:
  alloy_data:

configs:
  loki_config:
    content: |
      auth_enabled: false
      server:
        http_listen_port: 3100
        log_level: warn
      common:
        instance_addr: 127.0.0.1
        path_prefix: /loki
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory
        storage:
          filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
      schema_config:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      limits_config:
        retention_period: 720h          # 30 days
        allow_structured_metadata: true
        reject_old_samples: true
        reject_old_samples_max_age: 168h
      compactor:
        working_directory: /loki/compactor
        retention_enabled: true
        delete_request_store: filesystem
      analytics:
        reporting_enabled: false

  alloy_config:
    content: |
      // Discover running containers via the Docker API.
      discovery.docker "containers" {
        host = "unix:///var/run/docker.sock"
      }

      // Label each stream by container name and compose service. Labels stay low-cardinality
      // on purpose (Loki indexes labels only); trace IDs stay in the log line, not a label.
      discovery.relabel "containers" {
        targets = discovery.docker.containers.targets

        rule {
          source_labels = ["__meta_docker_container_name"]
          regex         = "/(.*)"
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_docker_container_label_com_docker_compose_service"]
          target_label  = "service"
        }
      }

      loki.source.docker "containers" {
        host       = "unix:///var/run/docker.sock"
        targets    = discovery.relabel.containers.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki:3100/loki/api/v1/push"
        }
      }

# Bind-mount fallback if Portainer's compose is older than 2.23: save the two `content:` blocks
# above as /opt/runs/observability/loki.yaml and alloy.config, delete the top-level `configs:`
# section and the per-service `configs:` entries, and mount them instead:
#   loki:   - /opt/runs/observability/loki.yaml:/etc/loki/config.yaml:ro
#   alloy:  - /opt/runs/observability/alloy.config:/etc/alloy/config.alloy:ro
