# ─────────────────────────────────────────────────────────────────────────────
# Sathish Stack — VirtualBox / Portainer
#
# Services:  project DBs (managed block) · rabbitmq
#            config-server · sathishlogger · eventstracker · watchtower
#
# The section between the PROJECT-DBS markers is GENERATED by
#   consolidated-postgres/scripts/vm/vm-db-up.sh <project...>
# Do not hand-edit inside the markers — your changes will be overwritten.
#
# Required env vars (set in Portainer stack → Environment tab). A complete
# template lives in env/.env.vm.example — copy it to env/.env.vm (gitignored) and
# fill in real values. When using scripts/vm/vm-db-up.sh, DB credentials are
# pushed automatically from each project's local .env, but the base vars
# below must still be present in env/.env.vm:
#
#   Base / shared:
#     GIT_URI                        git repo URI for Spring Cloud Config
#     ENCRYPT_KEY                    Spring Cloud Config encrypt.key
#     CONFIG_SERVER_USERNAME         basic-auth username for config server
#     CONFIG_SERVER_PASSWORD         basic-auth password for config server
#     RABBITMQ_DEFAULT_USER          RabbitMQ admin user
#     RABBITMQ_DEFAULT_PASS          RabbitMQ admin password
#     DOCKERHUB_TOKEN                Docker Hub token (used by watchtower)
#     EVENT_DOMAIN_USER              initial event-domain user for eventstracker
#     EVENT_DOMAIN_USER_PASSWORD     password for the initial event-domain user
#
#   Project databases (eventstracker is always required):
#     EVENTS_TRACKER_DB_NAME / _USER / _PASSWORD
#     RUNS_APP_DB_NAME / _USER / _PASSWORD            (when enabled)
#     RUNS_AI_ANALYZER_DB_NAME / _USER / _PASSWORD    (when enabled)
#     GITHUB_CLEANER_DB_NAME / _USER / _PASSWORD      (when enabled)
#     DBCLEANER_DB_NAME / _USER / _PASSWORD           (when enabled)
#     SATHISHLOGGER_DB_NAME / _USER / _PASSWORD       (when enabled)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Project databases (managed by consolidated-postgres) ───────────────────
  # >>> PROJECT-DBS:START — generated, do not edit by hand
  # NOTE: Most project DBs using native PostgreSQL on host (172.17.0.1:5432)
  # Exception: runs-ai-analyzer-db (Docker with pgvector) — extension easier in container

  runs-ai-analyzer-db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RUNS_AI_ANALYZER_DB_NAME:-runs_ai_analyzer_db}
      POSTGRES_USER: ${RUNS_AI_ANALYZER_DB_USER:?set in Portainer stack env}
      POSTGRES_PASSWORD: ${RUNS_AI_ANALYZER_DB_PASSWORD:?set in Portainer stack env}
    ports:
      - "5444:5432"
    volumes:
      - pg_data_runs_ai_analyzer:/var/lib/postgresql/data
    networks:
      - sathish-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${RUNS_AI_ANALYZER_DB_USER} -d ${RUNS_AI_ANALYZER_DB_NAME:-runs_ai_analyzer_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
  # >>> PROJECT-DBS:END

  # ── Static infrastructure ───────────────────────────────────────────────────
  # (the github-cleaner DB is now generated in the PROJECT-DBS block above —
  #  pass verbose-barnacle to vm-db-up.sh to include it)

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - sathish-net
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 15s
      timeout: 10s
      retries: 5
# ── Application Services ────────────────────────────────────────────────────
  config-server:
    image: travelhelper0h/sathishproject-config-server:latest
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      GIT_URI: ${GIT_URI}
      encrypt_key: ${ENCRYPT_KEY}
      SPRING_SECURITY_USER_NAME: ${CONFIG_SERVER_USERNAME}
      SPRING_SECURITY_USER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
      # Required by BasicAuthBean (@Value("${username}") / @Value("${pass}"))
      username: ${CONFIG_SERVER_USERNAME}
      pass: ${CONFIG_SERVER_PASSWORD}
    networks:
      - sathish-net
    # Every actuator endpoint lives under /sathishconfigserver and requires basic
    # auth, so the probe must send the Authorization header. $$ escapes compose
    # interpolation so $username/$pass resolve inside the container. We target
    # /info (stable 200), NOT /health: /health can return 503 because the built-in
    # configServer component reports DOWN when it can't load a default env from git.
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- --header=\"Authorization: Basic $$(echo -n $$username:$$pass | base64)\" http://localhost:8888/sathishconfigserver/info >/dev/null 2>&1 || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 40s

  sathishlogger:
    image: travelhelper0h/sathishlogger:latest
    restart: unless-stopped
    ports:
      - "8090:8080"     # host 8090 → container 8080 (avoids conflict with other services)
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_CLOUD_CONFIG_USERNAME: ${CONFIG_SERVER_USERNAME}
      SPRING_CLOUD_CONFIG_PASSWORD: ${CONFIG_SERVER_PASSWORD}
      DATABASE_URL: jdbc:postgresql://172.17.0.1:5432/${SATHISHLOGGER_DB_NAME:-sathishlogger}
      DATABASE_USERNAME: ${SATHISHLOGGER_DB_USER}
      DATABASE_PASSWORD: ${SATHISHLOGGER_DB_PASSWORD}
      JPA_DDL_AUTO: update
      LOG_LEVEL: INFO
      STORAGE_TYPE: database
      LOG_RETENTION_DAYS: 30
    volumes:
      - logger_data:/app/data
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - sathish-net

  eventstracker:
    image: travelhelper0h/eventstracker:latest
    restart: unless-stopped
    ports:
      - "9081:9081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Force the app to listen on 9081 inside the container so it matches the
      # published port below. Without this the app relies on server.port coming
      # from the config-server git repo; if that's missing it defaults to 8080
      # and host 9081 -> container 9081 hits nothing (ERR_CONNECTION_REFUSED).
      SERVER_PORT: 9081
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_CLOUD_CONFIG_USERNAME: ${CONFIG_SERVER_USERNAME}
      SPRING_CLOUD_CONFIG_PASSWORD: ${CONFIG_SERVER_PASSWORD}
      # Canonical DB/RabbitMQ names — eventstracker-local.yml AND eventstracker-prod.yml
      # (config-server) both read these exact ${...} names. This is the ONLY set of
      # datasource/rabbitmq env vars eventstracker needs; do not add SPRING_DATASOURCE_*
      # or SPRING_RABBITMQ_* here — the app never reads those, and a second set of names
      # is exactly how this broke before (see consolidated-postgres/scripts/vm/check-stack-consistency.sh).
      EVENTS_TRACKER_DB_URL: jdbc:postgresql://172.17.0.1:5432/${EVENTS_TRACKER_DB_NAME:-event-service}
      EVENTS_TRACKER_DB_USER: ${EVENTS_TRACKER_DB_USER}
      EVENTS_TRACKER_DB_PASSWORD: ${EVENTS_TRACKER_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      # Seed credentials for the initial event-domain user (EventDomainUserDataLoader).
      # The app aborts startup if these are null. Set EVENT_DOMAIN_USER /
      # EVENT_DOMAIN_USER_PASSWORD in the Portainer stack env.
      # Key names must match EventDomainUserDataLoader's environment.getProperty()
      # lookups exactly (case-sensitive) — camelCase keys here would set a
      # differently-named container env var and the app would still crash.
      EVENT_DOMAIN_USER: ${EVENT_DOMAIN_USER}
      EVENT_DOMAIN_USER_PASSWORD: ${EVENT_DOMAIN_USER_PASSWORD}
      # Centralized logging service URL — SathishLoggerAppender forwards WARN+ logs here.
      # Must use the Docker service name (sathishlogger) not localhost, since containers
      # are on the same sathish-net network and localhost refers to the container itself.
      SATHISHLOGGER_URL: http://sathishlogger:8080
    depends_on:
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sathish-net

  dbcleaner:
    image: travelhelper0h/dbcleaner:latest
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8085
      # ── Spring Cloud Config (same config-server as eventstracker) ──
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_CLOUD_CONFIG_USERNAME: ${CONFIG_SERVER_USERNAME}
      SPRING_CLOUD_CONFIG_PASSWORD: ${CONFIG_SERVER_PASSWORD}
      # ── Primary datasource (dbcleaner's own DB, managed in PROJECT-DBS) ──
      JDBC_DATABASE_URL: jdbc:postgresql://172.17.0.1:5432/${DBCLEANER_DB_NAME:-dbcleaner}
      JDBC_DATABASE_USERNAME: ${DBCLEANER_DB_USER}
      JDBC_DATABASE_PASSWORD: ${DBCLEANER_DB_PASSWORD}
      # ── External datasources it cleans (now all point to native PostgreSQL) ──
      RUNS_APP_DB_URL: jdbc:postgresql://172.17.0.1:5432/${RUNS_APP_DB_NAME:-runsapp_db}
      RUNS_APP_DB_USERNAME: ${RUNS_APP_DB_USER}
      RUNS_APP_DB_PASSWORD: ${RUNS_APP_DB_PASSWORD}
      EVENTS_TRACKER_DB_URL: jdbc:postgresql://172.17.0.1:5432/${EVENTS_TRACKER_DB_NAME:-event-service}
      EVENTS_TRACKER_DB_USERNAME: ${EVENTS_TRACKER_DB_USER}
      EVENTS_TRACKER_DB_PASSWORD: ${EVENTS_TRACKER_DB_PASSWORD}
      RUNS_AI_DB_URL: jdbc:postgresql://runs-ai-analyzer-db:5432/${RUNS_AI_ANALYZER_DB_NAME:-runs_ai_analyzer_db}
      RUNS_AI_DB_USERNAME: ${RUNS_AI_ANALYZER_DB_USER}
      RUNS_AI_DB_PASSWORD: ${RUNS_AI_ANALYZER_DB_PASSWORD}
    # Hard dependency on its own DB. The external datasources (Hikari pools)
    # connect at startup, so if runs-app-db / runs-ai-analyzer-db aren't up yet
    # the app restarts until they are (restart: unless-stopped). We avoid a hard
    # depends_on to those services because they're optional in the generated
    # PROJECT-DBS block.
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - sathish-net
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health >/dev/null 2>&1 || exit 1" ]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s

  runs-app:
    image: ghcr.io/sathishjayapal/runs-app:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_CLOUD_CONFIG_USERNAME: ${CONFIG_SERVER_USERNAME}
      SPRING_CLOUD_CONFIG_PASSWORD: ${CONFIG_SERVER_PASSWORD}
      JDBC_DATABASE_URL: jdbc:postgresql://172.17.0.1:5432/${RUNS_APP_DB_NAME:-runsapp_db}
      JDBC_DATABASE_USERNAME: ${RUNS_APP_DB_USER}
      JDBC_DATABASE_PASSWORD: ${RUNS_APP_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      RUNS_AI_ANALYZER_URL: http://runs-ai-analyzer:8081
      # Google Drive credentials (base64 encoded, decoded on startup)
      GARMIN_DRIVE_SERVICE_ACCOUNT_KEY_BASE64: ${GARMIN_DRIVE_SERVICE_ACCOUNT_KEY_BASE64}
      GARMIN_DRIVE_SERVICE_ACCOUNT_KEY_PATH: ${GARMIN_DRIVE_SERVICE_ACCOUNT_KEY_PATH}
      GARMIN_DRIVE_FOLDER_ID: ${GARMIN_DRIVE_FOLDER_ID}
      GARMIN_DRIVE_PROCESSED_FOLDER_ID: ${GARMIN_DRIVE_PROCESSED_FOLDER_ID}
      GARMIN_DRIVE_QUARANTINE_FOLDER_ID: ${GARMIN_DRIVE_QUARANTINE_FOLDER_ID}
      GARMIN_DRIVE_FAILED_FOLDER_ID: ${GARMIN_DRIVE_FAILED_FOLDER_ID}
      GARMIN_DRIVE_RETRY_FOLDER_ID: ${GARMIN_DRIVE_RETRY_FOLDER_ID}
      # Garmin import configuration
      GARMIN_SYSTEM_USER_ID: ${GARMIN_SYSTEM_USER_ID}
      GARMIN_CSV_IMPORT_SCHEDULE: ${GARMIN_CSV_IMPORT_SCHEDULE}
      GARMIN_CSV_IMPORT_ENABLED: ${GARMIN_CSV_IMPORT_ENABLED}
      # SMTP configuration
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_DISPLAY_NAME: ${MAIL_DISPLAY_NAME}
      # Alert configuration
      GARMIN_ALERT_EMAIL_ENABLED: ${GARMIN_ALERT_EMAIL_ENABLED}
      GARMIN_ALERT_EMAIL_MAX_RETRY_ATTEMPTS: ${GARMIN_ALERT_EMAIL_MAX_RETRY_ATTEMPTS}
      GARMIN_ALERT_EMAIL_RECIPIENTS: ${GARMIN_ALERT_EMAIL_RECIPIENTS}
      GARMIN_ALERT_EMAIL_FROM: ${GARMIN_ALERT_EMAIL_FROM}
      # Sample data and other settings
      APP_INITIALIZATION_ENABLE_SAMPLE_DATA: ${APP_INITIALIZATION_ENABLE_SAMPLE_DATA}
      APP_INITIALIZATION_ADMIN_EMAIL: ${APP_INITIALIZATION_ADMIN_EMAIL}
      APP_INITIALIZATION_ADMIN_PASSWORD: ${APP_INITIALIZATION_ADMIN_PASSWORD}
      APP_INITIALIZATION_USER_EMAIL: ${APP_INITIALIZATION_USER_EMAIL}
      APP_INITIALIZATION_USER_PASSWORD: ${APP_INITIALIZATION_USER_PASSWORD}
      APP_INITIALIZATION_SYSTEM_EMAIL: ${APP_INITIALIZATION_SYSTEM_EMAIL}
      APP_INITIALIZATION_SYSTEM_PASSWORD: ${APP_INITIALIZATION_SYSTEM_PASSWORD}
      BASE_HOST: ${BASE_HOST}
      PRODUCTION: ${PRODUCTION}
      API_PATH: ${API_PATH}
    # Decode base64 credentials and start app
    entrypoint: /bin/sh -c "
      if [ -n \"$$GARMIN_DRIVE_SERVICE_ACCOUNT_KEY_BASE64\" ]; then
        mkdir -p /app/credentials &&
        echo $$GARMIN_DRIVE_SERVICE_ACCOUNT_KEY_BASE64 | base64 -d > $$GARMIN_DRIVE_SERVICE_ACCOUNT_KEY_PATH &&
        chmod 600 $$GARMIN_DRIVE_SERVICE_ACCOUNT_KEY_PATH;
      fi &&
      exec java -jar app.jar
      "
    depends_on:
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sathish-net
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  runs-ai-analyzer:
    image: ghcr.io/sathishjayapal/runs-ai-analyzer:latest
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_CLOUD_CONFIG_USERNAME: ${CONFIG_SERVER_USERNAME}
      SPRING_CLOUD_CONFIG_PASSWORD: ${CONFIG_SERVER_PASSWORD}
      RUNS_AI_ANALYZER_DB_URL: jdbc:postgresql://runs-ai-analyzer-db:5432/${RUNS_AI_ANALYZER_DB_NAME:-runs_ai_analyzer_db}
      RUNS_AI_ANALYZER_DB_USER: ${RUNS_AI_ANALYZER_DB_USER}
      RUNS_AI_ANALYZER_DB_PASSWORD: ${RUNS_AI_ANALYZER_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      OLLAMA_BASE_URL: http://host.docker.internal:11434  # Changed from http://ollama:11434
      RUNS_APP_BASE_URL: http://runs-app:8080
    depends_on:
      config-server:
        condition: service_healthy
      runs-ai-analyzer-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # Removed: ollama dependency
    networks:
      - sathish-net
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Watchtower — auto-redeploy on new Docker Hub :latest ───────────────────
  # Polls every 300 s (5 min). When GitHub Actions pushes a new image,
  # Watchtower detects it and restarts the affected container automatically.
  # No webhook or port-forwarding to VirtualBox needed.
  #
  # containrrr/watchtower is archived upstream (frozen at v1.7.1, Nov 2023) —
  # its bundled Docker client SDK only speaks API 1.25, which breaks against
  # newer Docker Engine (crash loop: "client version 1.25 is too old").
  # nickfedor/watchtower is the actively maintained community fork
  # (github.com/nicholas-fedor/watchtower). Pinned to a specific version
  # rather than :latest so this doesn't silently go stale again — bump
  # deliberately by checking https://hub.docker.com/r/nickfedor/watchtower/tags.

  watchtower:
    image: nickfedor/watchtower:1.20.3
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: 300
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_ROLLING_RESTART: "false"
    networks:
      - sathish-net

  # ── cAdvisor — per-container metrics for Prometheus (container-down alerting) ──
  # Host port 9099, NOT 8080: 8080 is reserved for the runs-app app container
  # when it's deployed to this VM (see runs-app-db above; only the DB is here today).
  # Image pinned to ghcr.io/google/cadvisor (NOT gcr.io/cadvisor/cadvisor, which
  # stopped publishing new tags after v0.53.0 — see google/cadvisor#3793) at a
  # version whose bundled Docker client speaks API >=1.44, required by this VM's
  # Docker Engine 29.1.3. v0.49.1's client (API 1.41) fails Docker factory
  # registration entirely, silently degrading to raw-cgroup-only metrics with no
  # container name/label data — which is what broke the ContainerDown alert.
  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.5
    restart: unless-stopped
    privileged: true
    ports:
      - "9099:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - sathish-net

volumes:
  # >>> PROJECT-DB-VOLUMES:START — generated, do not edit by hand
  # NOTE: Most project DB volumes removed — using native PostgreSQL on host (172.17.0.1:5432)
  # Removed: pg_data_eventstracker, pg_data_github_cleaner, pg_data_dbcleaner, pg_data_sathishlogger, pg_data_runs_app
  # Kept: pg_data_runs_ai_analyzer (Docker container with pgvector)
  pg_data_runs_ai_analyzer:
  # >>> PROJECT-DB-VOLUMES:END
  rabbitmq_data:
  logger_data:

networks:
  sathish-net:
    driver: bridge