version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Sathish Stack — VirtualBox / Portainer
#
# Services:  project DBs (managed block) · rabbitmq
#            config-server · sathishlogger · eventstracker · watchtower
#
# The section between the PROJECT-DBS markers is GENERATED by
#   consolidated-postgres/scripts/vm/vm-db-up.sh <project...>
# Do not hand-edit inside the markers — your changes will be overwritten.
#
# Required env vars (set in Portainer stack → Environment tab). A complete
# template lives in env/.env.vm.example — copy it to env/.env.vm (gitignored) and
# fill in real values. When using scripts/vm/vm-db-up.sh, DB credentials are
# pushed automatically from each project's local .env, but the base vars
# below must still be present in env/.env.vm:
#
#   Base / shared:
#     GIT_URI                        git repo URI for Spring Cloud Config
#     ENCRYPT_KEY                    Spring Cloud Config encrypt.key
#     CONFIG_SERVER_USERNAME         basic-auth username for config server
#     CONFIG_SERVER_PASSWORD         basic-auth password for config server
#     RABBITMQ_DEFAULT_USER          RabbitMQ admin user
#     RABBITMQ_DEFAULT_PASS          RabbitMQ admin password
#     DOCKERHUB_TOKEN                Docker Hub token (used by watchtower)
#     EVENT_DOMAIN_USER              initial event-domain user for eventstracker
#     EVENT_DOMAIN_USER_PASSWORD     password for the initial event-domain user
#
#   Project databases (eventstracker is always required):
#     EVENTS_TRACKER_DB_NAME / _USER / _PASSWORD
#     RUNS_APP_DB_NAME / _USER / _PASSWORD            (when enabled)
#     RUNS_AI_ANALYZER_DB_NAME / _USER / _PASSWORD    (when enabled)
#     GITHUB_CLEANER_DB_NAME / _USER / _PASSWORD      (when enabled)
#     DBCLEANER_DB_NAME / _USER / _PASSWORD           (when enabled)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Project databases (managed by consolidated-postgres) ───────────────────
  # >>> PROJECT-DBS:START — generated, do not edit by hand
  eventstracker-db:
    image: postgres:17.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EVENTS_TRACKER_DB_NAME:-event-service}
      POSTGRES_USER: ${EVENTS_TRACKER_DB_USER:?set in Portainer stack env}
      POSTGRES_PASSWORD: ${EVENTS_TRACKER_DB_PASSWORD:?set in Portainer stack env}
    ports:
      - "6433:5432"
    volumes:
      - pg_data_eventstracker:/var/lib/postgresql/data
    networks:
      - sathish-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${EVENTS_TRACKER_DB_USER} -d ${EVENTS_TRACKER_DB_NAME:-event-service}" ]
      interval: 10s
      timeout: 5s
      retries: 5
  runs-app-db:
    image: postgres:18.1
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RUNS_APP_DB_NAME:-runsapp_db}
      POSTGRES_USER: ${RUNS_APP_DB_USER:?set in Portainer stack env}
      POSTGRES_PASSWORD: ${RUNS_APP_DB_PASSWORD:?set in Portainer stack env}
    ports:
      - "5443:5432"
    volumes:
      - pg_data_runs_app:/var/lib/postgresql
    networks:
      - sathish-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${RUNS_APP_DB_USER} -d ${RUNS_APP_DB_NAME:-runsapp_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
  runs-ai-analyzer-db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RUNS_AI_ANALYZER_DB_NAME:-runs_ai_analyzer_db}
      POSTGRES_USER: ${RUNS_AI_ANALYZER_DB_USER:?set in Portainer stack env}
      POSTGRES_PASSWORD: ${RUNS_AI_ANALYZER_DB_PASSWORD:?set in Portainer stack env}
    ports:
      - "5444:5432"
    volumes:
      - pg_data_runs_ai_analyzer:/var/lib/postgresql/data
    networks:
      - sathish-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${RUNS_AI_ANALYZER_DB_USER} -d ${RUNS_AI_ANALYZER_DB_NAME:-runs_ai_analyzer_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
  github-cleaner-db:
    image: postgres:17.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GITHUB_CLEANER_DB_NAME:-my-github-cleaner}
      POSTGRES_USER: ${GITHUB_CLEANER_DB_USER:?set in Portainer stack env}
      POSTGRES_PASSWORD: ${GITHUB_CLEANER_DB_PASSWORD:?set in Portainer stack env}
    ports:
      - "5439:5432"
    volumes:
      - pg_data_github_cleaner:/var/lib/postgresql/data
    networks:
      - sathish-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${GITHUB_CLEANER_DB_USER} -d ${GITHUB_CLEANER_DB_NAME:-my-github-cleaner}" ]
      interval: 10s
      timeout: 5s
      retries: 5
  dbcleaner-db:
    image: postgres:18.3
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DBCLEANER_DB_NAME:-dbcleaner}
      POSTGRES_USER: ${DBCLEANER_DB_USER:?set in Portainer stack env}
      POSTGRES_PASSWORD: ${DBCLEANER_DB_PASSWORD:?set in Portainer stack env}
    ports:
      - "5433:5432"
    volumes:
      - pg_data_dbcleaner:/var/lib/postgresql
    networks:
      - sathish-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DBCLEANER_DB_USER} -d ${DBCLEANER_DB_NAME:-dbcleaner}" ]
      interval: 10s
      timeout: 5s
      retries: 5
  # >>> PROJECT-DBS:END

  # ── Static infrastructure ───────────────────────────────────────────────────
  # (the github-cleaner DB is now generated in the PROJECT-DBS block above —
  #  pass verbose-barnacle to vm-db-up.sh to include it)

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - sathish-net
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Application Services ────────────────────────────────────────────────────

  config-server:
    image: travelhelper0h/sathishproject-config-server:latest
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      GIT_URI: ${GIT_URI}
      encrypt_key: ${ENCRYPT_KEY}
      SPRING_SECURITY_USER_NAME: ${CONFIG_SERVER_USERNAME}
      SPRING_SECURITY_USER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
      # Required by BasicAuthBean (@Value("${username}") / @Value("${pass}"))
      username: ${CONFIG_SERVER_USERNAME}
      pass: ${CONFIG_SERVER_PASSWORD}
    networks:
      - sathish-net
    # Every actuator endpoint lives under /sathishconfigserver and requires basic
    # auth, so the probe must send the Authorization header. $$ escapes compose
    # interpolation so $username/$pass resolve inside the container. We target
    # /info (stable 200), NOT /health: /health can return 503 because the built-in
    # configServer component reports DOWN when it can't load a default env from git.
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- --header=\"Authorization: Basic $$(echo -n $$username:$$pass | base64)\" http://localhost:8888/sathishconfigserver/info >/dev/null 2>&1 || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 40s

  sathishlogger:
    image: travelhelper0h/sathishlogger:latest
    restart: unless-stopped
    ports:
      - "8090:8080"     # host 8090 → container 8080 (avoids conflict with other services)
    environment:
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:h2:file:/app/data/sathishlogger
      DATABASE_USERNAME: sa
      DATABASE_PASSWORD: ""
      JPA_DDL_AUTO: update
      LOG_LEVEL: INFO
      STORAGE_TYPE: database
      LOG_RETENTION_DAYS: 30
    volumes:
      - logger_data:/app/data
    networks:
      - sathish-net

  eventstracker:
    image: travelhelper0h/eventstracker:latest
    restart: unless-stopped
    ports:
      - "9081:9081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Force the app to listen on 9081 inside the container so it matches the
      # published port below. Without this the app relies on server.port coming
      # from the config-server git repo; if that's missing it defaults to 8080
      # and host 9081 -> container 9081 hits nothing (ERR_CONNECTION_REFUSED).
      SERVER_PORT: 9081
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_CLOUD_CONFIG_USERNAME: ${CONFIG_SERVER_USERNAME}
      SPRING_CLOUD_CONFIG_PASSWORD: ${CONFIG_SERVER_PASSWORD}
      # Canonical DB/RabbitMQ names — eventstracker-local.yml AND eventstracker-prod.yml
      # (config-server) both read these exact ${...} names. This is the ONLY set of
      # datasource/rabbitmq env vars eventstracker needs; do not add SPRING_DATASOURCE_*
      # or SPRING_RABBITMQ_* here — the app never reads those, and a second set of names
      # is exactly how this broke before (see consolidated-postgres/scripts/vm/check-stack-consistency.sh).
      EVENTS_TRACKER_DB_URL: jdbc:postgresql://eventstracker-db:5432/${EVENTS_TRACKER_DB_NAME:-event-service}
      EVENTS_TRACKER_DB_USER: ${EVENTS_TRACKER_DB_USER}
      EVENTS_TRACKER_DB_PASSWORD: ${EVENTS_TRACKER_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      # Seed credentials for the initial event-domain user (EventDomainUserDataLoader).
      # The app aborts startup if these are null. Set EVENT_DOMAIN_USER /
      # EVENT_DOMAIN_USER_PASSWORD in the Portainer stack env.
      # Key names must match EventDomainUserDataLoader's environment.getProperty()
      # lookups exactly (case-sensitive) — camelCase keys here would set a
      # differently-named container env var and the app would still crash.
      EVENT_DOMAIN_USER: ${EVENT_DOMAIN_USER}
      EVENT_DOMAIN_USER_PASSWORD: ${EVENT_DOMAIN_USER_PASSWORD}
    depends_on:
      config-server:
        condition: service_healthy
      eventstracker-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sathish-net

  dbcleaner:
    image: travelhelper0h/dbcleaner:latest
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8085
      # ── Spring Cloud Config (same config-server as eventstracker) ──
      CONFIG_SERVER_URL: http://config-server:8888
      SPRING_CLOUD_CONFIG_USERNAME: ${CONFIG_SERVER_USERNAME}
      SPRING_CLOUD_CONFIG_PASSWORD: ${CONFIG_SERVER_PASSWORD}
      # ── Primary datasource (dbcleaner's own DB, managed in PROJECT-DBS) ──
      JDBC_DATABASE_URL: jdbc:postgresql://dbcleaner-db:5432/${DBCLEANER_DB_NAME:-dbcleaner}
      JDBC_DATABASE_USERNAME: ${DBCLEANER_DB_USER}
      JDBC_DATABASE_PASSWORD: ${DBCLEANER_DB_PASSWORD}
      # ── External datasources it cleans (point at the other stack DBs by
      #    service name). These DBs must be enabled in the PROJECT-DBS block
      #    (pass runs-app / runs-ai-analyzer / eventstracker to vm-db-up.sh). ──
      RUNS_APP_DB_URL: jdbc:postgresql://runs-app-db:5432/${RUNS_APP_DB_NAME:-runsapp_db}
      RUNS_APP_DB_USERNAME: ${RUNS_APP_DB_USER}
      RUNS_APP_DB_PASSWORD: ${RUNS_APP_DB_PASSWORD}
      EVENTS_TRACKER_DB_URL: jdbc:postgresql://eventstracker-db:5432/${EVENTS_TRACKER_DB_NAME:-event-service}
      EVENTS_TRACKER_DB_USERNAME: ${EVENTS_TRACKER_DB_USER}
      EVENTS_TRACKER_DB_PASSWORD: ${EVENTS_TRACKER_DB_PASSWORD}
      RUNS_AI_DB_URL: jdbc:postgresql://runs-ai-analyzer-db:5432/${RUNS_AI_ANALYZER_DB_NAME:-runs_ai_analyzer_db}
      RUNS_AI_DB_USERNAME: ${RUNS_AI_ANALYZER_DB_USER}
      RUNS_AI_DB_PASSWORD: ${RUNS_AI_ANALYZER_DB_PASSWORD}
    # Hard dependency on its own DB. The external datasources (Hikari pools)
    # connect at startup, so if runs-app-db / runs-ai-analyzer-db aren't up yet
    # the app restarts until they are (restart: unless-stopped). We avoid a hard
    # depends_on to those services because they're optional in the generated
    # PROJECT-DBS block.
    depends_on:
      dbcleaner-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - sathish-net
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health >/dev/null 2>&1 || exit 1" ]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s

  # ── Watchtower — auto-redeploy on new Docker Hub :latest ───────────────────
  # Polls every 300 s (5 min). When GitHub Actions pushes a new image,
  # Watchtower detects it and restarts the affected container automatically.
  # No webhook or port-forwarding to VirtualBox needed.

  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: 300
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_ROLLING_RESTART: "true"
      # Authenticate to Docker Hub so Watchtower can pull private images
      REPO_USER: travelhelper0h
      REPO_PASS: ${DOCKERHUB_TOKEN}
    networks:
      - sathish-net

volumes:
  # >>> PROJECT-DB-VOLUMES:START — generated, do not edit by hand
  pg_data_eventstracker:
  pg_data_runs_app:
  pg_data_runs_ai_analyzer:
  pg_data_github_cleaner:
  pg_data_dbcleaner:
  # >>> PROJECT-DB-VOLUMES:END
  rabbitmq_data:
  logger_data:

networks:
  sathish-net:
    driver: bridge
