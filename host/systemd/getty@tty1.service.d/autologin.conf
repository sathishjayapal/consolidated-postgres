# /etc/systemd/system/getty@tty1.service.d/autologin.conf on runs-server.
# runs-server has no keyboard; this logs skminfotech in on tty1 after boot so
# the console is usable when a monitor is plugged in. Captured 2026-11-18.
# Trade-off: anyone with physical access gets a shell as skminfotech (which has sudo, password still required).
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin skminfotech --noclear %I $TERM
