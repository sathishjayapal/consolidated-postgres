# /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg on runs-server (added 2026-11-18).
# Belt and braces: /etc/cloud/cloud-init.disabled already stops cloud-init, but if
# that file is removed, cloud-init would regenerate netplan from
# 90-installer-network.cfg, which lacks `dhcp-identifier: mac` -> lockout.
network: {config: disabled}
